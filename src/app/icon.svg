<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="18" fill="url(#grad-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glow Orbit -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#grad-glow)" stroke-width="1" stroke-dasharray="4 2" opacity="0.6" />

  <!-- Central AI Sparkle / Star Emblem -->
  <g filter="url(#neon-glow)">
    <!-- 4-point Diamond Star (Gemini & Grok AI signature geometry) -->
    <path
      d="M32 12 C32 23 23 32 12 32 C23 32 32 41 32 52 C32 41 41 32 52 32 C41 32 32 23 32 12 Z"
      fill="url(#grad-core)"
    />
    <!-- Center Core Glow -->
    <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
    <!-- Secondary Micro Sparkles -->
    <circle cx="45" cy="19" r="2" fill="#38bdf8" opacity="0.9" />
    <circle cx="19" cy="45" r="1.5" fill="#a855f7" opacity="0.8" />
  </g>
</svg>
